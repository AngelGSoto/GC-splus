data_file = input_cigale.csv
parameters_file = 
sed_modules = sfhdelayed, bc03, dustatt_modified_starburst, redshifting
analysis_method = pdf_analysis
cores = 4

bands = decam.u, decam.u_err, decam.g, decam.g_err, decam.r, decam.r_err, decam.i, decam.i_err, decam.z, decam.z_err

properties = 
additionalerror = 0.05

[sed_modules_params]
  
  [[sfhdelayed]]
    tau_main = 1000, 2000, 5000
    age_main = 5000, 8000, 10000
    tau_burst = 50.0
    age_burst = 20
    f_burst = 0.0, 0.01
    sfr_A = 1.0
    normalise = True
  
  [[bc03]]
    imf = 1
    metallicity = 0.004, 0.008, 0.02
    separation_age = 10
  
  [[dustatt_modified_starburst]]
    E_BV_lines = 0.01, 0.05, 0.1, 0.2
    E_BV_factor = 0.44
    uv_bump_wavelength = 217.5
    uv_bump_width = 35.0
    uv_bump_amplitude = 0.0, 1.0
    powerlaw_slope = -1.0, -0.5
    filters = decam.u & decam.g & decam.r & decam.i & decam.z
  
  [[redshifting]]
    redshift = 

[analysis_params]
  variables = 
  bands = decam.u, decam.g, decam.r, decam.i, decam.z
  save_best_sed = True
  save_chi2 = none
  lim_flag = noscaling
  mock_flag = False
  redshift_decimals = 1
  blocks = 1
